# Runs the checks of docs/testing on every push (docs/decisions/ci.md).
#
# The static job needs no database. The dynamic job runs the tests, which start
# their own MySQL container with Testcontainers; the runner has Docker.
#
# Nothing here is a secret. The database passwords in db/init are test values.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Compiler warnings are errors in every module.
      - run: ./gradlew compileJava compileTestJava compileTestFixturesJava

  dynamic:
    name: Tests on MySQL
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: "**/build/reports/tests/test/"
