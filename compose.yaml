# Development database (docs/decisions/mysql-docker.md).
#
#   docker compose up -d --wait      start; db/init/*.sql runs on the first start
#   docker compose down -v           remove the container and its data
#
# db/init runs only when the data directory is empty. After changing a file
# there, remove the data and start again.
#
# Tests do not use this container. They start their own (db/src/test).

name: gradgown

services:
  mysql:
    # The test container uses the same tag (MySqlTestDatabase.IMAGE).
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: gradgown
      # Local development only. Not a secret.
      MYSQL_ROOT_PASSWORD: root-local-only
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./db/conf/gradgown.cnf:/etc/mysql/conf.d/gradgown.cnf:ro
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP on purpose: the server that runs db/init listens on the
      # socket only, so this passes once initialisation has finished.
      test: ["CMD-SHELL", "mysqladmin ping --protocol=tcp -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
