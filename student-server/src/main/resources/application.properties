spring.application.name=gradgown-student-server

# Local only (docs/decisions/local-only.md).
server.address=127.0.0.1
server.port=8080
# The admin server runs on the same host. A cookie is not bound to a port, so
# the two servers need different session cookie names.
server.servlet.session.cookie.name=GRADGOWN_STUDENT

# The student account: SELECT on the schedule, INSERT and column-level UPDATE on
# reservations, registrations and audit logs, no DELETE (db/init/03-accounts.sql).
# The password is for local development only.
spring.datasource.username=gradgown_student
spring.datasource.password=student-local-only
# Every session runs in Seoul time, so a TIMESTAMP read or written without an
# offset is a Seoul time whatever the server default is.
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/gradgown?connectionTimeZone=Asia/Seoul&forceConnectionTimeZoneToSession=true
