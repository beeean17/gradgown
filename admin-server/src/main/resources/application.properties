spring.application.name=gradgown-admin-server

# Local only (docs/decisions/local-only.md).
server.address=127.0.0.1
server.port=8081
# The student server runs on the same host. A cookie is not bound to a port, so
# the two servers need different session cookie names.
server.servlet.session.cookie.name=GRADGOWN_ADMIN

# Two database accounts, one connection pool each (db/init/03-accounts.sql):
#   admin   SELECT on everything, nothing else
#   master  SELECT, INSERT, UPDATE, DELETE on everything
# A request runs on the pool that matches the role of the signed-in user.
# The passwords are for local development only.
gradgown.datasource.url=jdbc:mysql://127.0.0.1:3306/gradgown?connectionTimeZone=Asia/Seoul&forceConnectionTimeZoneToSession=true
gradgown.datasource.admin.username=gradgown_admin
gradgown.datasource.admin.password=admin-local-only
gradgown.datasource.master.username=gradgown_master
gradgown.datasource.master.password=master-local-only
